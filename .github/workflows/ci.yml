name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Android SDK + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust tests
        working-directory: rust
        run: cargo test

      - name: Build, lint, unit tests
        run: ./gradlew assembleDebug lint testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: nullveil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
